{% extends "admin/change_list.html" %}

{% block search %}
    {{ block.super }}

    
    <div class="filtros-chamados">

        <form method="get" action="{% url 'admin:chamados_chamado_changelist' %}">

            <div class="filtro-campo">

                <label for="filtro-setor">
                    Setor
                </label>

                <select name="setor" id="filtro-setor">

                    <option value="">
                        Todos
                    </option>

                    {% for setor in setores_filtro %}

                        <option
                            value="{{ setor.id }}"
                            {% if filtros.setor == setor.id|stringformat:"s" %}
                                selected
                            {% endif %}
                        >
                            {{ setor.nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="filtro-campo">

                <label for="filtro-local">
                    Local
                </label>

                <select name="local" id="filtro-local">

                    <option value="">
                        Todos
                    </option>

                    {% for local in locais_filtro %}

                        <option
                            value="{{ local.id }}"
                            {% if filtros.local == local.id|stringformat:"s" %}
                                selected
                            {% endif %}
                        >
                            {{ local.nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="filtro-campo">

                <label for="filtro-status">
                    Status
                </label>

                <select name="status" id="filtro-status">

                    <option
                        value=""
                        {% if not filtros.status %}
                            selected
                        {% endif %}
                    >
                        Todos
                    </option>

                    <option
                        value="ABERTO,ATENDIMENTO"
                        {% if filtros.status == "ABERTO,ATENDIMENTO" %}
                            selected
                        {% endif %}
                    >
                        Aberto / Em atendimento
                    </option>

                    <option
                        value="FINALIZADO"
                        {% if filtros.status == "FINALIZADO" %}
                            selected
                        {% endif %}
                    >
                        Finalizado
                    </option>

                </select>

            </div>


            <div class="filtro-campo filtro-solicitante">

                <label for="filtro-solicitante">
                    Solicitante
                </label>

                <input
                    type="text"
                    name="solicitante"
                    id="filtro-solicitante"
                    value="{{ filtros.solicitante }}"
                    placeholder="Nome do solicitante"
                >

            </div>


            <div class="filtro-acoes">

                <button type="submit">
                    FILTRAR
                </button>

                <a href="{% url 'admin:chamados_chamado_changelist' %}">
                    LIMPAR
                </a>

            </div>

        </form>


    </div>
{% endblock %}
