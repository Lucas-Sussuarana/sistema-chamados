{% extends "admin/change_list.html" %}

{% block search %}
    {{ block.super }}

    <div class="quantidade-chamados">
        <span>Exibir:</span>

        {% for quantidade in quantidades_por_pagina %}
            <a
                href="?per_page={{ quantidade }}"
                class="{% if cl.paginator.per_page == quantidade %}ativo{% endif %}"
            >
                {{ quantidade }}
            </a>
        {% endfor %}
    </div>
{% endblock %}
